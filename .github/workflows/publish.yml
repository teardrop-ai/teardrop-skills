name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Least privilege by default; publish job elevates for OIDC.
permissions:
  contents: read

jobs:
  test:
    name: "Test (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install teardrop-cli (latest compatible)
        # Pin typer/click so `teardrop <group> --help` returns rc=0 (see CI).
        run: |
          python -m pip install "typer==0.12.5" "click==8.1.7"
          python -m pip install "teardrop-cli>=0.3.2,<0.4"

      - name: Run structural + contract + smoke tests
        run: python -m pytest -q

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' does not match pyproject version '$PKG' (expected 'v$PKG'"
            exit 1
          fi
          echo "Publishing teardrop-skills $PKG from tag $GITHUB_REF_NAME"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        # hatchling backend via standard PEP 517 frontend
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Verify skills are packaged in the wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          skills = sorted(
              n for n in names
              if n.startswith("teardrop_skills/skills/") and n.endswith("/SKILL.md")
          )
          print(f"Found {len(skills)} packaged skills:")
          for name in skills:
              print(f"  {name}")
          if len(skills) < 7:
              raise SystemExit(f"expected >= 7 skills in wheel, found {len(skills)}")
          PY

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/teardrop-skills
    permissions:
      id-token: write  # trusted publisher (OIDC)

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1